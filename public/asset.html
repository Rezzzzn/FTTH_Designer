<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fiber Network</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,600,700,300italic,400italic,600italic">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
      #map {
        height: 600px;
        width: 100%;
        border-radius: 10px;
      }

      #fileInput {
        float: left;
        margin-top: 12px;
      }
    </style>
</head>
<body class="layout-fixed sidebar-expand-lg bg-body-tertiary">
    <section class="content-header">
      <div class="header-container">
        <div class="header-title">
          <div class="header-text">
            <span class="header-main">Dashboard</span>
            <span class="header-sub">Control Panel</span>
          </div>
          <div class="header-actions">
            <input type="file" id="fileInput" name="kmlFile" accept=".kml" placeholder="Select KML File" />
            <div class="file-input-container">
              <button class="btn btn-warning" onclick="exportData()">
                <i class="fa fa-download"></i>
                Export
              </button>
              <button class="btn btn-danger" onclick="handleImport()">
                <i class="fa fa-upload"></i>
                Import
              </button>
            </div>
          </div>
        </div>
      </div>

      <section class="content">
        <div class="row">
          <div class="col-lg-12 col-xs-12">
            <div id="map"></div>
            <button id="saveProject" class="btn btn-success mt-3">
              <i class="fa fa-save"></i> Save Project
            </button>
          </div>
        </div>
      </section>
    </section>

    <!-- Modal untuk Mengisi Nama Project -->
    <div class="modal fade" id="projectModal" tabindex="-1" role="dialog" aria-labelledby="projectModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-md" role="document">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="projectModalLabel">Masukkan Nama Project</h5>
            <button type="button" class="close" data-dismiss="modal" aria-label="Close">
              <span aria-hidden="true">&times;</span>
            </button>
          </div>
          <div class="modal-body">
            <form id="projectForm">
              <div class="form-group">
                <label for="projectName">Nama Project</label>
                <input type="text" class="form-control" id="projectName" name="projectName" placeholder="Masukkan nama project" required>
              </div>
            </form>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn1 btn-secondary" data-dismiss="modal">Tutup</button>
            <button type="button" class="btn1 btn-primaryy" id="saveProjectBtn">Simpan</button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
      // Initialize map
      function initMap() {
        const map = new google.maps.Map(document.getElementById('map'), {
          center: { lat: -7.9, lng: 112.6 },
          zoom: 12,
        });
        
        // Map initialization code would go here
      }
      
      // Handle Save Project button
      document.getElementById('saveProject').addEventListener('click', function() {
        $('#projectModal').modal('show');
      });
      
      document.getElementById('saveProjectBtn').addEventListener('click', function() {
        const projectName = document.getElementById('projectName').value;
        
        if (projectName.trim() === '') {
          Swal.fire({
            title: 'Error!',
            text: 'Nama project tidak boleh kosong.',
            icon: 'error',
            confirmButtonText: 'OK'
          });
          return;
        }
        
        Swal.fire({
          title: 'Success!',
          text: `Nama project "${projectName}" telah disimpan.`,
          icon: 'success',
          confirmButtonText: 'OK'
        }).then(() => {
          $('#projectModal').modal('hide');
          // Redirect to BOQ page with project name as parameter
          window.location.href = `boq.html?projectName=${encodeURIComponent(projectName)}`;
        });
      });
      
      // Placeholder functions for import/export
      function handleImport() {
        alert('Import functionality would be implemented here');
      }
      
      function exportData() {
        alert('Export functionality would be implemented here');
      }
    </script>
    <script src="/get-google-maps-api"></script>
    <script src="assets/js/map.js"></script>
</body>
</html>
