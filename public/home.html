    <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Map</title>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="assets/css/styles.css">
    <link rel="stylesheet" href="assets/css/sidebar.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,600,700,300italic,400italic,600italic">
    <script src="/get-google-maps-api"></script>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
        }
        /* Simplified Sidebar Styles */
       
        #map {
      height: 600px;
      width: 100%;
      border-radius: 10px;
    }


/* Responsif untuk layar kecil */
@media (max-width: 768px) {
    #map {
        height: 400px; /* Kurangi tinggi pada layar kecil */
        width: 95%;
    }
}

/* Responsif untuk layar sangat kecil (misalnya ponsel) */
@media (max-width: 480px) {
    #map {
        height: 300px; /* Kurangi lagi tinggi untuk HP */
        width: 100%;
    }
}


    </style>
</head>
<body>
    <header class="navbar navbar-dark bg-dark p-3">
        
        <div class="ml-auto">
             <a class="text-light mx-2" title="Menuju Halaman Home" href="?page=home"><i class="fas fa-home"></i></a>
           <!-- <a class="text-light mx-2" href="#"><i class="fas fa-map"></i></a>
            <a class="text-light mx-2" href="#"><i class="fas fa-file-alt"></i></a> -->
            <a class="text-light mx-2"  title="Menuju Halaman User" href="edit_profile.html"><i class="fas fa-user"></i></a>
        </div>
    </header>

    <aside class="main-sidebar">
    <a class="navbar-brand" href="?page=home" style="margin-left:4rem; color: white; margin-top: 1rem;">Project Map</a>
        <div class="sidebar-divider"></div>
        
        <div class="user-panel">
            <div class="pull-left image">
                <img src="assets/image/Pateer.jpg" alt="User Image">
                <span class="status-indicator"></span>
            </div>
            <div class="pull-left info">
                    <h5 class="hidden-xs" >admin</h5>
                
                <p class="user-role">Network Administrator</p>
            </div>
        </div>
    
        <div class="sidebar-divider"></div>
    
        <div class="sidebar-heading">Main Navigation</div>
    
        <ul class="sidebar-menu">
            <li class="nav-item active" style="margin-top: 10px;">
                <a href="?page=home" class="nav-link d-flex align-items-center">
                    <i class="fas fa-tachometer-alt " style="margin-right: 10px;"></i>
                    <span>Dashboard</span>
                </a>
            </li>
        </ul>
    
    
    </aside>
    
    <section class="content-header" >
        <div class="header-container">
            <div class="header-title">
                <div class="header-text">
                    <span class="header-main">Dashboard</span>
                    <span class="header-sub">Control Panel</span>
                </div>
                <div class="header-actions">
                    <input type="file" id="fileInput" name="kmlFile" accept=".kml" placeholder="Select KML File" />
                    <div class="file-input-container">
                        <button class="btn btn-danger" onclick="handleImport()">
                            <i class="fa fa-download"></i>
                            Import
                        </button>
                        <button class="btn btn-warning" onclick="exportData()">
                            <i class="fa fa-upload"></i>
                            Export
                        </button>
                        <button id="saveProjectlock" class="btn btn-success">
                            <i class="fa fa-save"></i> Save Project
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <div class="row">
          <div class="col-lg-12 col-xs-12">
            <div id="map"></div>
          </div>
        </div>
      
    </section>
    
    <div class="modal fade" id="projectModal" tabindex="-1" role="dialog" aria-labelledby="projectModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-md" role="document">
            <div class="modal-content">
                <div class="modal-header"> 
                    <h5 class="modal-title" id="projectModalLabel" >Masukkan Nama Project</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <form id="projectForm">
                        <div class="form-group">
                            <label for="projectName">Nama Project</label>
                            <input type="text" class="form-control" id="projectName" name="projectName" placeholder="Masukkan nama project" required>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">Tutup</button>
                    <button type="button" class="btn btn-primaryy" id="saveProject">Lanjut</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/map.js"></script>
    <script src="assets/js/modal.js"></script>
</body>
</html>
